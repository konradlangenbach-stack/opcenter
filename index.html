<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4fb3ff"><link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png"><title>Operation Center</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,sans-serif;color:var(--fg);background:var(--bg) fixed;--fg:#10243a;--card:rgba(255,255,255,.55)}
body.dark{--fg:#f2f4ff;--card:rgba(255,255,255,.12)}
.stars{background-image:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 120px,#fff,transparent),radial-gradient(1.5px 1.5px at 160px 60px,#fff,transparent),radial-gradient(1px 1px at 230px 170px,#fff,transparent),radial-gradient(2px 2px at 300px 90px,#fff,transparent);background-size:320px 220px,var(--sz,auto)}
.s-home{--bg:linear-gradient(180deg,#d6f0ff,#5db8ff 55%,#2e8fe8)}
.s-heute{--bg:linear-gradient(180deg,#ffe3a8,#ff9a5a 55%,#ff6b7a)}
.s-monat{--bg:linear-gradient(180deg,#c7f3ee,#4db6e5)}
.s-termine{--bg:linear-gradient(180deg,#f6a6c1,#8e5fd1 55%,#3b2a7a)}
.s-think{--bg:linear-gradient(180deg,#0b1030,#26205a)}
.s-wellness{--bg:linear-gradient(180deg,#ffd6e8,#c9b8ff 55%,#9ad7ff)}
.s-einkauf{--bg:linear-gradient(180deg,#fff6b7,#b8f2c0)}
.s-training{--bg:linear-gradient(180deg,#2b3445,#5a3a4a 60%,#ff8a3d)}
.s-wishes{--bg:linear-gradient(180deg,#2a1055,#7a3fd1)}
.s-routinen{--bg:linear-gradient(180deg,#fff0b8,#ffa751)}
.s-bericht{--bg:linear-gradient(180deg,#050818,#1a1f4d)}
.s-check{--bg:linear-gradient(180deg,#0b3d3a,#1fa88a 70%,#7be0c3)}
.s-think,.s-wishes,.s-bericht,.s-check,.s-training,.s-termine{--fg:#f2f4ff;--card:rgba(255,255,255,.13)}
#app{max-width:560px;margin:auto;padding:max(14px,env(safe-area-inset-top)) 14px 40px}
h1{font-size:1.4rem;margin:.3em 0}h2{font-size:1.05rem;margin:1em 0 .4em}
.top{display:flex;align-items:center;gap:10px}.top button,button{border:0;border-radius:12px;padding:10px 14px;background:var(--card);color:var(--fg);font-size:1rem;backdrop-filter:blur(6px)}
.card{background:var(--card);border-radius:16px;padding:12px;margin:8px 0;backdrop-filter:blur(6px)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{padding:18px 8px;text-align:center;font-weight:600}.tile span{display:block;font-size:1.8rem}
input,select,textarea{width:100%;padding:10px;border-radius:10px;border:0;margin:4px 0;font-size:1rem;background:rgba(255,255,255,.85);color:#10243a}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>button{flex:0 0 auto}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(128,128,128,.25)}
.item:last-child{border:0}.done{text-decoration:line-through;opacity:.6}
.amp{border-radius:16px;padding:14px;color:#fff;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal b{padding:8px 0;border-radius:10px;background:var(--c,transparent);border:2px solid transparent;font-weight:500;font-size:.9rem}.cal b.on{border-color:var(--fg)}
.bar{height:10px;border-radius:5px;background:currentColor;opacity:.8}small{opacity:.75}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),K='opcenter2';
const def={events:[],think:[],wellness:[],wlog:[],shop:[],train:[],wishes:[],routines:[],checks:{}};
let D=Object.assign({},def,JSON.parse(localStorage.getItem(K)||'{}'));
const save=()=>localStorage.setItem(K,JSON.stringify(D));
const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>iso(new Date()),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const val=id=>$('#'+id).value.trim(),WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
const P={home:['Operation Center','🛰️'],heute:['Tagesplan','🌅'],monat:['Monat','🗓️'],termine:['Termine & iCal','➕'],think:['Think-Space','🌌'],wellness:['Wellness','🧘'],einkauf:['Einkauf','🛒'],training:['Trainingsplan','🏀'],wishes:['Wünsche','✨'],routinen:['Routinen','🔁'],bericht:['Wochenbericht','📈'],check:['Belastungs-Check','⚖️']};
let cur='home',mon=new Date(),sel=today(),V={};
/* ---- Belastungs-Algorithmus ---- */
const LT={training:1,schule:.6,sonstiges:.5};
function evLoad(e){return e.dur*(e.type=='training'?(e.rpe||6)/6:LT[e.type]||.5)}
function load(s){let l=D.events.filter(e=>e.date==s).reduce((a,e)=>a+evLoad(e),0);const w=new Date(s+'T12:00').getDay();return l+D.train.filter(t=>t.wd==w).reduce((a,t)=>a+t.dur*t.rpe/6,0)}
function ready(s){const c=D.checks[s]||{};return((c.phys||3)+(c.psy||3)+(c.sleep||3))/3}
function cap(s){let c=300+(ready(s)-3)*80;const p=new Date(s+'T12:00');p.setDate(p.getDate()-1);const q=iso(p);if(load(q)/cap0(q)>1)c-=40;return c}
function cap0(s){return 300+(ready(s)-3)*80}
function amp(r){return r<.7?['#2fa36b','Grün – Luft für mehr']:r<.95?['#e0a100','Gelb – voll, aber machbar']:['#d9473f','Rot – nichts mehr drauf']}
/* ---- Navigation ---- */
function go(v){cur=v;render();scrollTo(0,0)}
function render(){const dark=['think','wishes','bericht','check'].includes(cur);document.body.className='s-'+cur+(dark?' stars':'');
$('#app').innerHTML=cur=='home'?home():`<div class=top><button onclick="go('home')">←</button><h1>${P[cur][1]} ${P[cur][0]}</h1></div>`+V[cur]()}
function home(){const t=today(),r=load(t)/cap(t),a=amp(r);
return `<h1>🛰️ Operation Center</h1><small>${new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'})}</small>
<div class=amp style="background:${a[0]};margin:12px 0" onclick="go('heute')">Heute: ${a[1]}<br><small>${Math.round(r*100)}% Auslastung</small></div>
${new Date().getDay()==0?'<div class=card onclick="go(\'bericht\')">📈 Sonntag – dein Wochenbericht ist bereit</div>':''}
<div class=grid>${Object.keys(P).filter(k=>k!='home').map(k=>`<button class=tile onclick="go('${k}')"><span>${P[k][1]}</span>${P[k][0]}</button>`).join('')}</div>`}
/* ---- Tagesplan ---- */
function chk(k,v){const t=today();D.checks[t]=Object.assign({},D.checks[t],{[k]:v});save();render()}
function evRow(e){return `<div class=item><span>${e.time||'ganztg.'} · ${esc(e.title)} <small>${e.type}${e.dur?' · '+e.dur+' min':''}</small></span><button onclick="delEv('${e.id}')">✕</button></div>`}
function delEv(id){D.events=D.events.filter(e=>e.id!=id);save();render()}
function dayList(s){const w=new Date(s+'T12:00').getDay();const ev=D.events.filter(e=>e.date==s).sort((a,b)=>(a.time||'').localeCompare(b.time||'')).map(evRow).join('');
const pl=D.train.filter(t=>t.wd==w).map(t=>`<div class=item><span>🏀 ${esc(t.title)} <small>Plan · ${t.dur} min · RPE ${t.rpe}</small></span></div>`).join('');return ev+pl||'<small>Nichts geplant.</small>'}
V.heute=()=>{const t=today(),c=D.checks[t]||{},r=load(t)/cap(t),a=amp(r),free=Math.max(0,Math.round(cap(t)-load(t)));
const S=(k,l)=>`<label>${l}<select onchange="chk('${k}',+this.value)"><option value="">–</option>${[1,2,3,4,5].map(n=>`<option ${c[k]==n?'selected':''}>${n}</option>`).join('')}</select></label>`;
return `<div class=amp style="background:${a[0]}">${a[1]}<br><small>Last ${Math.round(load(t))} / Kapazität ${Math.round(cap(t))} · frei ≈ ${free} Punkte (≈ ${free} Min lockere Aktivität)</small></div>
<h2>Check-in (1 schlecht – 5 super)</h2><div class="card row">${S('phys','Körper')}${S('psy','Kopf')}${S('sleep','Schlaf')}</div>
<h2>Heute</h2><div class=card>${dayList(t)}</div>
<h2>Routinen</h2><div class=card>${D.routines.map(r=>`<div class=item><span class="${r.log[t]?'done':''}">${esc(r.t)}</span><button onclick="tog('${r.id}')">${r.log[t]?'✔':'○'}</button></div>`).join('')||'<small>Noch keine Routinen.</small>'}</div>`}
/* ---- Monat ---- */
V.monat=()=>{const y=mon.getFullYear(),m=mon.getMonth(),off=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();let c='';
for(let i=0;i<off;i++)c+='<i></i>';
for(let d=1;d<=n;d++){const s=iso(new Date(y,m,d)),w=new Date(y,m,d).getDay(),r=load(s)/cap(s),has=D.train.some(t=>t.wd==w)||D.events.some(e=>e.date==s&&e.type=='training');
c+=`<b class="${s==sel?'on':''}" onclick="sel='${s}';render()" style="--c:${load(s)?amp(r)[0]+'aa':'transparent'}">${d}${has?'<br>🏀':''}</b>`}
return `<div class=row><button onclick="mon=new Date(${y},${m-1},1);render()">‹</button><b style="text-align:center">${mon.toLocaleDateString('de-DE',{month:'long',year:'numeric'})}</b><button onclick="mon=new Date(${y},${m+1},1);render()">›</button></div>
<div class=cal style="margin-top:8px">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(x=>`<small>${x}</small>`).join('')}${c}</div>
<h2>${new Date(sel+'T12:00').toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'})}</h2><div class=card>${dayList(sel)}</div><small>Farbe = Auslastung · 🏀 = Training</small>`}
/* ---- Termine + iCal ---- */
V.termine=()=>`<div class=card><input id=ed type=date value="${sel}"><div class=row><input id=et type=time><input id=edu type=number placeholder="Minuten" value=60></div>
<select id=ety><option>schule<option>training<option>sonstiges</select><input id=eti placeholder="Titel"><select id=erpe><option value=6>Intensität (RPE 1–10) – nur Training<option>3<option>5<option>7<option>8<option>9</select>
<button onclick="addEv()">Termin hinzufügen</button></div>
<div class=card><b>iCal importieren (.ics)</b><input type=file id=icsf accept=".ics,text/calendar" onchange="impIcs(this)"><small>Einmalige Termine werden importiert; Serientermine (RRULE) werden nicht aufgelöst.</small></div>
<h2>Kommende Termine</h2><div class=card>${D.events.filter(e=>e.date>=today()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,40).map(e=>`<div class=item><span>${e.date.slice(5)} ${e.time||''} · ${esc(e.title)}</span><button onclick="delEv('${e.id}')">✕</button></div>`).join('')||'<small>Keine.</small>'}</div>`;
function addEv(){const t=val('eti');if(!t)return;D.events.push({id:uid(),date:val('ed')||today(),time:val('et'),dur:+val('edu')||0,type:val('ety'),title:t,rpe:+val('erpe')||6});save();render()}
function ics(txt){txt=txt.replace(/\r?\n[ \t]/g,'');const out=[];txt.split('BEGIN:VEVENT').slice(1).forEach(b=>{const g=k=>{const m=b.match(new RegExp('^'+k+'[^:\\n]*:(.*)$','m'));return m?m[1].trim():''};
const pd=s=>{const m=s.match(/(\d{4})(\d\d)(\d\d)(?:T(\d\d)(\d\d))?(Z)?/);if(!m)return null;return m[6]?new Date(Date.UTC(+m[1],m[2]-1,+m[3],+m[4],+m[5])):new Date(+m[1],m[2]-1,+m[3],+(m[4]||0),+(m[5]||0))};
const a=g('DTSTART'),s=pd(a),e=pd(g('DTEND'));if(!s)return;const all=!/T\d/.test(a),ti=g('SUMMARY').replace(/\\,/g,',')||'Termin';
out.push({id:uid(),date:iso(s),time:all?'':s.toTimeString().slice(0,5),dur:all?0:(e?Math.max(15,Math.round((e-s)/6e4)):60),type:/training|spiel|basket/i.test(ti)?'training':/schule|unterricht|klausur|mathe|deutsch|englisch|bio|physik/i.test(ti)?'schule':'sonstiges',title:ti,rpe:6})});return out}
function impIcs(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{let n=0;ics(r.result).forEach(e=>{if(!D.events.some(x=>x.date==e.date&&x.time==e.time&&x.title==e.title)){D.events.push(e);n++}});save();alert(n+' Termine importiert');render()};r.readAsText(f)}
/* ---- Listen-Seiten ---- */
function listPage(key,ph,extra=''){return `<div class=card><div class=row><input id=li placeholder="${ph}"><button onclick="addL('${key}')">＋</button></div>${extra}</div><div class=card>${D[key].map((x,i)=>`<div class=item><span class="${x.done?'done':''}" onclick="doneL('${key}',${i})">${esc(x.t)}${x.k?` <small>${x.k}</small>`:''}</span><button onclick="D.${key}.splice(${i},1);save();render()">✕</button></div>`).join('')||'<small>Leer.</small>'}</div>`}
function addL(k){const t=val('li');if(!t)return;const o={t};if($('#lk'))o.k=val('lk');D[k].push(o);save();render()}
function doneL(k,i){D[k][i].done=!D[k][i].done;save();render()}
V.think=()=>`<small>Kopf leeren – Gedanken, Sorgen, Ideen. Nichts muss sofort gelöst werden.</small>`+listPage('think','Was beschäftigt dich?');
V.einkauf=()=>listPage('shop','Artikel')+`<button onclick="D.shop=D.shop.filter(x=>!x.done);save();render()">Erledigte entfernen</button>`;
V.wishes=()=>listPage('wishes','Aktivität oder Wunsch','<select id=lk><option>Aktivität<option>Wunsch</select>')+`<button onclick="go('check')">Passt das in meine Woche? →</button>`;
const WP=['🌬️ Atmen 4-7-8 (3 Min)','🚶 Spaziergang','🤸 Dehnen / Mobility','🚿 Kalt duschen','📓 Journaling','🎧 Musik hören','🧘 Meditation (10 Min)','😴 Powernap 20 Min'];
V.wellness=()=>{const t=today(),all=[...WP,...D.wellness.map(x=>x.t)];return `<small>Tippe, wenn du es gemacht hast – zählt in den Wochenbericht.</small>`+all.map(w=>`<div class="card item" onclick="D.wlog.push({date:'${t}',t:'${w.replace(/'/g,"")}'});save();render()"><span>${esc(w)}</span><b>${D.wlog.filter(x=>x.date==t&&x.t==w.replace(/'/g,"")).length||''}</b></div>`).join('')+`<div class=card><div class=row><input id=li placeholder="Eigene Aktivität"><button onclick="addL('wellness')">＋</button></div></div>`};
/* ---- Training ---- */
V.training=()=>`<div class=card><select id=tw>${[1,2,3,4,5,6,0].map(i=>`<option value=${i}>${WD[i]}`).join('')}</select><input id=tt placeholder="z.B. Team-Training, Kraft, Wurf"><div class=row><input id=td type=number placeholder="Minuten" value=90><input id=tr type=number placeholder="RPE 1-10" value=6 min=1 max=10></div><button onclick="addT()">Zum Wochenplan</button></div>
${[1,2,3,4,5,6,0].map(w=>{const l=D.train.map((t,i)=>[t,i]).filter(x=>x[0].wd==w);return l.length?`<div class=card><b>${WD[w]}</b>${l.map(([t,i])=>`<div class=item><span>${esc(t.title)} <small>${t.dur} min · RPE ${t.rpe}</small></span><button onclick="D.train.splice(${i},1);save();render()">✕</button></div>`).join('')}</div>`:''}).join('')}<small>Der Plan erscheint automatisch im Tagesplan und im Monat.</small>`;
function addT(){const t=val('tt');if(!t)return;D.train.push({wd:+val('tw'),title:t,dur:+val('td')||60,rpe:+val('tr')||6});save();render()}
/* ---- Routinen ---- */
V.routinen=()=>{const t=today();return `<div class=card><div class=row><input id=li placeholder="Neue Routine"><button onclick="addR()">＋</button></div></div>`+D.routines.map(r=>{let st=0;const d=new Date();if(!r.log[iso(d)])d.setDate(d.getDate()-1);while(r.log[iso(d)]){st++;d.setDate(d.getDate()-1)}
const dots=[...Array(7)].map((_,i)=>{const x=new Date();x.setDate(x.getDate()-6+i);return r.log[iso(x)]?'🟠':'⚪'}).join('');
return `<div class=card><div class=item><b>${esc(r.t)}</b><button onclick="tog('${r.id}')">${r.log[t]?'✔ heute':'○ heute'}</button></div><small>${dots} · Serie: ${st} Tage</small> <button onclick="D.routines=D.routines.filter(x=>x.id!='${r.id}');save();render()">✕</button></div>`}).join('')};
function addR(){const t=val('li');if(!t)return;D.routines.push({id:uid(),t,log:{}});save();render()}
function tog(id){const r=D.routines.find(x=>x.id==id);r.log[today()]=!r.log[today()];save();render()}
/* ---- Belastungs-Check ---- */
V.check=()=>{const mn=+($('#cm')?.value||60),ty=$('#cy')?.value||'training',rp=+($('#cr')?.value||6),add=evLoad({dur:mn,type:ty,rpe:rp});
const rows=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()+i);const s=iso(d),a=load(s)/cap(s),b=(load(s)+add)/cap(s);return `<div class=item><span>${WD[d.getDay()]} ${s.slice(8)}.</span><span>${Math.round(a*100)}% → <b style="color:${amp(b)[0]}">${Math.round(b*100)}%</b> ${b<.7?'✅':b<.95?'⚠️':'⛔'}</span></div>`}).join('');
return `<div class=card><small>Was willst du einbauen?</small><div class=row><input id=cm type=number value=${mn}><select id=cy><option ${ty=='training'?'selected':''}>training<option ${ty=='schule'?'selected':''}>schule<option ${ty=='sonstiges'?'selected':''}>sonstiges</select><input id=cr type=number min=1 max=10 value=${rp}></div><button onclick="render()">Prüfen</button></div>
<div class=card>${rows}</div><small>Auslastung = Last ÷ Kapazität. Kapazität basiert auf Check-in (Körper, Kopf, Schlaf) und sinkt nach einem überlasteten Vortag. ✅ unter 70 %, ⚠️ bis 95 %, ⛔ darüber.</small>`};
/* ---- Wochenbericht ---- */
function wk(o){const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7)+o*7);let L=0,R=[],pk=0,tr=0,days=[];
for(let i=0;i<7;i++){const x=new Date(d);x.setDate(d.getDate()+i);const s=iso(x);days.push(s);L+=load(s);pk=Math.max(pk,load(s)/cap(s));if(D.checks[s])R.push(ready(s));tr+=D.events.filter(e=>e.date==s&&e.type=='training').length+D.train.filter(t=>t.wd==x.getDay()).length}
const rp=D.routines.length?D.routines.reduce((a,r)=>a+days.filter(s=>r.log[s]).length,0)/(D.routines.length*7):0;
return{L,pk,tr,rp,w:D.wlog.filter(x=>days.includes(x.date)).length,rd:R.length?R.reduce((a,b)=>a+b)/R.length:0,s:days[0]}}
V.bericht=()=>{const a=wk(0),b=wk(-1),ar=(x,y,up=1)=>!y?'':x>y*1.05?(up?'🔺':'🔻'):x<y*.95?(up?'🔻':'🔺'):'➖';
let tip=a.pk>1?'Mindestens ein Tag war überlastet – nächste Woche einen Puffer-Tag einplanen.':a.rd&&a.rd<3?'Dein Befinden war eher niedrig – Erholung vor zusätzlichen Terminen.':a.L<b.L*.7&&b.L?'Deutlich weniger Last als letzte Woche – Raum für eine Zusatzeinheit.':'Gute Balance – so weitermachen.';
const W=[-5,-4,-3,-2,-1,0].map(wk),mx=Math.max(1,...W.map(x=>x.L));
return `<div class=card><b>Diese Woche (ab ${a.s.slice(5)})</b><div class=item><span>Gesamtlast</span><span>${Math.round(a.L)} ${ar(a.L,b.L)}</span></div><div class=item><span>Befinden Ø (1–5)</span><span>${a.rd?a.rd.toFixed(1):'–'} ${ar(a.rd,b.rd)}</span></div><div class=item><span>Spitzentag</span><span>${Math.round(a.pk*100)}% ${ar(a.pk,b.pk,0)}</span></div><div class=item><span>Trainings</span><span>${a.tr} ${ar(a.tr,b.tr)}</span></div><div class=item><span>Routinen erfüllt</span><span>${Math.round(a.rp*100)}% ${ar(a.rp,b.rp)}</span></div><div class=item><span>Wellness-Aktivitäten</span><span>${a.w} ${ar(a.w,b.w)}</span></div></div>
<div class=card>💡 ${tip}</div><h2>Trend (6 Wochen)</h2><div class=card>${W.map(x=>`<div style="margin:6px 0"><small>${x.s.slice(5)} · Last ${Math.round(x.L)} · Befinden ${x.rd?x.rd.toFixed(1):'–'}</small><div class=bar style="width:${x.L/mx*100}%;color:#7fd3ff"></div></div>`).join('')}</div>`}
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
